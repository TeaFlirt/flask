services:
  mysql:
    image: mysql:8.0
    container_name: tehnikum_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: passwd
      MYSQL_DATABASE: tehnikum
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppasswd"]
      timeout: 10s
      retries: 10
      interval: 10s
    networks:
      - tehnikum_network

  web:
    build: .
    container_name: tehnikum_web
    restart: always
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=passwd
      - MYSQL_DB=tehnikum
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - ./app/static/images:/app/app/static/images
    networks:
      - tehnikum_network
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: tehnikum_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/static:ro
    depends_on:
      - web
    networks:
      - tehnikum_network

networks:
  tehnikum_network:
    driver: bridge

volumes:
  mysql_data: